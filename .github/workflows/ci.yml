name: Toolkit validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ges-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce preserved workload membership and historical accounting
        run: >-
          python -m ges.claim_workload
          --reviews evidence/source-reviews
          --artifacts evidence/claim-workload-inputs/artifacts.jsonl.gz
          --reconciliation evidence/provider-oidc-reconciliation.json
          --check evidence/claim-workload-current-inventory.json
          --historical evidence/claim-workload-inventory.json
          --provenance evidence/claim-workload-current-provenance.json
          --recorded-membership
      - name: Reproduce complete current workload and exact approved transition
        run: >-
          python -m ges.claim_workload_migration
          --reviews evidence/source-reviews
          --artifacts evidence/claim-workload-inputs/artifacts.jsonl.gz
          --reconciliation evidence/provider-oidc-reconciliation.json
          --baseline evidence/claim-workload-current-inventory.json
          --historical evidence/claim-workload-inventory.json
          --provenance evidence/claim-workload-current-provenance.json
          --transition evidence/claim-workload-v02-transition.json
          --check evidence/claim-workload-v02-inventory.json
      - run: python -m ges validate
      - run: python -m ges compile
      - name: Generated views match the canonical catalog
        run: git diff --exit-code -- generated/functional-checklist.md generated/source-crosswalk.md generated/bindings.json
